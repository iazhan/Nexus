# 发布流水线：推一个 `v*` tag，远端编译出 Windows 安装包并发到 Releases。
#
# ## 为什么是 tag 触发而不是 push 到 master
#
# 版本号在 Nexus 是**单一事实源**（VERSIONING.md）：`pnpm version:bump` 推进十个清单，
# 提交跟着走，tag 是「这个提交就是那个版本」的落款。挂在分支上编译等于把「哪次提交
# 对应哪个安装包」交给时间顺序，而 tag 是唯一能回答它的东西。
#
# ## 四条判据
#
# 1. **tag 必须与 `package.json` 的版本号相等。** 不等就退出 —— 否则会产出一个
#    文件名写着 A、`app.getVersion()` 报 B 的安装包，而自动更新正是靠这两个值比较的。
#
# 2. **`contents: write` 是必需的。** 仓库默认的 `GITHUB_TOKEN` 可能只读，
#    少了这一句的表现是「打包全成功、上传资产 403」。
#
# 3. **发布由这个 workflow 用 `gh` 显式做**，打包那一步是 `--publish never`。
#    理由见下面「为什么不用 electron-builder 发布」。
#
# 4. **先建 draft、资产传齐再转正式。** draft 不在 `releases/latest` 里，
#    所以自动更新永远看不到一个「发布了一半」的版本。
#
# ## 为什么不用 electron-builder 的 `--publish always`
#
# 实测（2026-10-02，v0.64.0 第一次跑）：它把**同一个 tag 建成了两个 release**，
# 资产被劈成两半 —— 一个只有 `.blockmap`，另一个有 `.exe` + `latest.yml`。
# 而 `releases/latest` 只解析其中一个，另一个的资产等于不存在（差分更新拿不到 blockmap）。
# 更糟的是**流水线报的是绿**：它认为自己干完了。
#
# 所以发布这段自己写：资产清单是显式的、draft→正式 的次序是显式的，
# 而且顺序本身就把上面那个竞态消掉了（release 先存在，就不存在「两个并发创建」）。
#
# ## Release 的变更日志
#
# notes 由「**上一个 release tag → 当前 tag**」的提交自动生成：`git tag -l 'v*' --sort=-v:refname`
# 取最近一个（排除当前 tag），`git log prev..cur --no-merges` 列 subject。提交信息本身
# 就是 `type(scope): subject`（COMMIT_CONVENTION.md），直接当 changelog 条目，不再解析分类。
#
# 三个判据：
#
# - **checkout 必须 `fetch-depth: 0` + `fetch-tags: true`**（见 job 里的注释）。浅克隆下
#   这段会静默产出空列表，而流水线照样绿 —— 最难察觉的一种失败。
# - **取「最近一个 tag」而不是「上一个版本号」**：没打 tag 的版本（如 0.69.0 / 0.69.1）
#   会自然并入下一次发布的日志，这正是我们要的 —— 日志描述的是「相对上一次发布多了什么」。
# - **首次发布没有上一个 tag** 时退化成「该 tag 可达的全部提交」，不留空。
#
# ## 刻意不做的事
#
# **不跑测试。** 这里的职责是「把已提交的代码打成包」，而 desktop 那批真机用例要驱动
# 真实 Electron 进程（本地全量 131–137s，且对机器状态敏感）。让发布卡在一个与本次
# 改动无关的环境问题上，比少跑一轮更糟。测试是提交前的闸门，由本地负责。
#
# **只出 Windows。** 加 macOS 要另起一个 `macos-latest` job（签名与公证是另一摊事），
# 加 Linux 要 `AppImage` target。三个平台各自的 updater 元文件名不同
# （`latest.yml` / `latest-mac.yml` / `latest-linux.yml`），加的时候要一起考虑。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      # 变更日志要读「上一个 release tag → 当前 tag」的提交。默认是浅克隆（depth 1），
      # 里面既没有历史、也没有 tag —— `git log prev..cur` 会**静默**给出空结果，
      # 于是 Release notes 变成一条空列表，且流水线照样报绿。必须全量拉。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 ${pkg} 不一致 —— 先 pnpm version:bump 再打 tag"
            exit 1
          fi
          echo "版本 ${pkg} 与 tag 一致"

      # 双语更新日志要有人补。**只警告，不失败** —— 这条流水线的职责是「把已提交的代码打成包」，
      # 卡在一个文案上比少一条中文日志更糟。缺了它会回落到 GitHub 发布说明（英文），
      # 用户在更新窗口里看到的来源标签会写明这一点。
      - name: 检查双语更新日志是否已补
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if node -e "process.exit(require('./changelog.json')['${version}'] ? 0 : 1)" 2>/dev/null; then
            echo "changelog.json 已包含 ${version}"
          else
            echo "::warning::changelog.json 里没有 ${version} —— 更新窗口会回落到 GitHub 发布说明（只有英文）。补一条中英对照更好。"
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      # `--publish never` 只关掉「自动发布」，不影响产物：NSIS target 照样写出
      # `latest.yml`，包内也照样带 `app-update.yml`（那是 electron-updater 运行时读的）。
      - name: 打包
        run: pnpm --filter @nexus/desktop exec electron-builder --win --publish never

      - name: 校验打包产物齐全
        shell: bash
        working-directory: apps/desktop/dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in "Nexus-${version}-Setup.exe" "Nexus-${version}-Setup.exe.blockmap" "latest.yml"; do
            if [ ! -f "$f" ]; then
              echo "::error::打包产物缺少 $f"
              exit 1
            fi
          done
          ls -l

      - name: 发布到 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          dist="apps/desktop/dist"

          # 同一个 tag 下只允许一个 release。已经有就报错退出，而不是再建一个 ——
          # 重复 release 是静默的（GitHub 不禁），代价却落在所有客户端身上。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag 下已经存在 release —— 确认要重发就先把旧的删掉"
            exit 1
          fi

          # 变更日志：上一个 release tag（按版本排序取最近一个，排除当前 tag）→ 当前 tag。
          # 首次发布没有上一个 tag 时，退化成「该 tag 可达的全部提交」。
          prev_tag="$(git tag -l 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)"
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${tag}"
            heading="## 变更（${prev_tag} → ${tag}）"
          else
            range="${tag}"
            heading="## 变更（首个发布）"
          fi
          echo "变更范围：${range}"

          body="$(git log "$range" --no-merges --pretty=format:'- %s')"
          if [ -z "$body" ]; then
            body="- （本次发布没有新增提交）"
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          {
            printf '%s\n\n' "$heading"
            printf '%s\n\n' "$body"
            if [ -n "$prev_tag" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n\n' \
                "${GITHUB_REPOSITORY}" "${prev_tag}" "${tag}"
            fi
            printf 'Windows x64 installer, built from tag %s.\n' "${tag}"
          } > "$notes"
          cat "$notes"

          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --notes-file "$notes" \
            --verify-tag

          gh release upload "$tag" \
            "$dist/Nexus-${version}-Setup.exe" \
            "$dist/Nexus-${version}-Setup.exe.blockmap" \
            "$dist/latest.yml"

          gh release edit "$tag" --draft=false
