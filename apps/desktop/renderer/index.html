<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 的每一条放宽都要有理由和日期（plan §5.1 的三条红线）。
         2026-09-27（P3-08）加了 `img-src` 里的 `data:`：
         - mammoth 把 DOCX 里的内嵌图片转成 base64 data URI（`mammoth.images.dataUri`，
           在 `DocxRenderer.tsx` 里**显式**传着，就是为了让这条依赖有调用点可查）。
           不放行的话，带图片的 DOCX 会渲染出一堆破图 —— 而正文完好，看起来像
           「那份 DOCX 里的图坏了」而不是「CSP 拦了」。
         - `data:` 只加在 `img-src`。`script-src` 仍是 `'self'`，所以 data URI 里的
           脚本一律不执行 —— 这条放宽只影响「能显示哪些图片」，不扩大可执行面。

         2026-09-27（P3-07）加了两条、**撤掉了一条**：
         - 撤掉 `img-src` 里的 `file:`（P3-06 加的）。原方案是图片走 `file://` 换
           「零协议代码」（plan §10.4 定案 A），但实测推翻了它：`pnpm dev` 的页面来自
           `http://localhost:6200`，**Chromium 不允许 http 页面加载 `file://` 子资源**
           （`Not allowed to load local resource`），于是 dev 下图片全部打不开，
           而打包产物（`file://` 页面）却正常。**这不是 CSP 能修的** —— CSP 是
           「允许什么」的上限，管不了浏览器自身的本地资源策略，`img-src file:`
           加着也没用。图片因此改走 `nexus-asset://`，与 PDF 同一条通道。
           `file:` 现在**不出现在任何一条指令里**（比 P3-06 之前更严）。
         - `img-src ... nexus-asset:`：图片从这条通道加载。自定义协议由本应用在主进程
           注册并处理，每个请求都过 `checkBoundary` + symlink 逃逸检查 ——
           定案 A 里「图片路径没有工作区边界」那个已知缺口顺带被补上。
         - `connect-src ... nexus-asset:`：pdfjs 通过 fetch 向 `nexus-asset://` 发
           **Range 请求**分页取字节，cmap / 标准字体也从这里读；DOCX 也经它取整份字节。
           没有它，PDF 只能整份进内存（50MB 的文件会卡死），中文 PDF 会因取不到 cmap 而空白。
           **这不是新增的外部域**：`nexus-asset:` 由本应用自己处理，请求同样过边界校验。
           §10.4 硬约束第 2 条针对的是「外部域」，本条不违反。
         - `worker-src 'self' blob:`：pdfjs 的解析 worker。`'self'` 覆盖 dev 的
           http 与打包后的 `file://` 两种来源；`blob:` 是 pdfjs 在 module worker
           不可用时的回落路径 —— 去掉它不会报错，只会**静默退回主线程渲染**，
           表现为「大 PDF 打开时整个界面卡住」。这是 §5.1 spike 实测集里就有的一条。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' nexus-asset: data:; connect-src 'self' nexus-asset:; worker-src 'self' blob:;"
    />
    <!-- 中性初值：真正的标题由 App 按运行模式设置（workspace / lightweight）。
         这里写死「Nexus Lite」会让全量模式的窗口标题一直挂着 Lite ——
         页面加载后 <title> 会覆盖 BrowserWindow 的 title，所以问题出在这一行。 -->
    <title>Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
